# GoReleaser config: turns a pushed vX.Y.Z tag into a GitHub Release
# with binaries for every platform. Run by .github/workflows/release.yml.
# Validate locally with: goreleaser check
version: 2

project_name: codec

# The Go binary embeds the frontend, so build it first. Output goes to
# the gitignored internal/web/dist/app, so the git tree stays clean.
before:
  hooks:
    - npm --prefix frontend ci
    - npm --prefix frontend run build

builds:
  - id: codec
    main: ./cmd/codec
    binary: codec
    env:
      - CGO_ENABLED=0 # fully static; the clipboard library needs no cgo
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      # .Tag keeps the leading "v" (v1.0.0), matching `git describe`.
      - -X github.com/mahasenabheetha/codec/v2/internal/version.Version={{ .Tag }}
      - -X github.com/mahasenabheetha/codec/v2/internal/version.Commit={{ .FullCommit }}
      - -X github.com/mahasenabheetha/codec/v2/internal/version.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE

checksum:
  name_template: checksums.txt

# Multi-platform image from the Linux binaries above (see Dockerfile),
# pushed to GitHub Container Registry. Every release gets its version
# tag (2.0.0-alpha.1); only stable releases move "latest".
dockers_v2:
  - images:
      - ghcr.io/mahasenabheetha/codec
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: codec
      org.opencontainers.image.description: Read-only YAML workbench and DevOps toolbox (web UI)
      org.opencontainers.image.source: https://github.com/mahasenabheetha/codec
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"

release:
  # Tags like v2.0.0-alpha.1 are published as pre-releases automatically.
  prerelease: auto
  # Published by the desktop job in release.yml once the Windows desktop
  # files are attached, so a release is never public without them.
  draft: true
