# Reusable: ci.yml calls it once per matrix entry.
name: Test

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      go-version:
        type: string
        default: "1.26"

jobs:
  test:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}
      - name: Test
        run: go test ./...
