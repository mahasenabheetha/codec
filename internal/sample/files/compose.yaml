services:
  shop:
    image: nginxinc/nginx-unprivileged:${SHOP_TAG:-1.27}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SHOP_PORT}:8080"
    environment:
      LOG_LEVEL: debug
      DATABASE_URL: postgres://shop:${DB_PASSWORD}@db:5432/shop
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: shop
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 5s
      retries: 10

volumes:
  db-data: {}
