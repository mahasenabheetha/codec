trigger:
  branches:
    include:
      - main

parameters:
  - name: environments
    displayName: Deploy to
    type: object
    default: [dev, prod]
  - name: runTests
    type: boolean
    default: true

variables:
  buildConfiguration: Release

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    jobs:
      - job: Build
        steps:
          - template: ci/azure-build.yml
            parameters:
              runTests: ${{ parameters.runTests }}

  - ${{ each env in parameters.environments }}:
      - stage: Deploy_${{ env }}
        dependsOn: Build
        jobs:
          - deployment: Deploy
            environment: shop-${{ env }}
            strategy:
              runOnce:
                deploy:
                  steps:
                    - script: echo "Deploying to ${{ env }}"
                      displayName: Deploy
