replicaCount: 1

image:
  repository: nginxinc/nginx-unprivileged
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

containerPort: 8080

ingress:
  enabled: false
  className: nginx
  host: shop.local

# Settings the app reads from its ConfigMap.
config:
  logLevel: debug
  currency: EUR
  featureFlags:
    newCheckout: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
