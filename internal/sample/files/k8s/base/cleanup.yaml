# Hover the schedule to read it in plain words, with its next runs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shop-cleanup
  labels:
    app.kubernetes.io/name: shop
spec:
  schedule: "*/30 1-5 * * 1-5"
  timeZone: Europe/Stockholm
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shop-cleanup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: busybox:1.37
              command: ["sh", "-c", "echo removing expired carts"]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
