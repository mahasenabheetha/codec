apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-prod
resources:
  - ../../base
images:
  - name: nginxinc/nginx-unprivileged
    newTag: "1.27.3"
patches:
  - path: replicas.yaml
configMapGenerator:
  - name: shop-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
