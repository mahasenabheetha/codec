apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app: web}
spec:
  replicas: 3
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web, tier: frontend}
    spec:
      serviceAccountName: web
      imagePullSecrets:
        - name: registry
      containers:
        - name: app
          image: nginx:1.27
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: web-config}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: db, key: password}
            - name: OPTIONAL
              valueFrom:
                secretKeyRef: {name: maybe, key: x, optional: true}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
        - name: sidecar
          image: envoyproxy/envoy@sha256:abc
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: web-data}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: web}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: web-typo
spec:
  selector: {app: webb}
  ports:
    - {port: 80, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: web-badport
spec:
  selector: {app: web}
  ports:
    - {port: 81, targetPort: metrics}
