apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
namePrefix: prod-
labels:
  - pairs: {env: prod}
    includeSelectors: false
resources:
  - ../../base
  - pdb.yaml
components:
  - ../../components/monitoring
images:
  - name: registry.example.com/app
    newTag: "1.4.2"
replicas:
  - name: app
    count: 3
patches:
  - path: resources.yaml
configMapGenerator:
  - name: app-config
    behavior: merge
    envs:
      - prod.env
    files:
      - settings.json
secretGenerator:
  - name: db
    literals:
      - password=s3cr3t
