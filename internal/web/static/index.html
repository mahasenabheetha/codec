<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codec</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header>
    <h1><span>codec</span></h1>
    <p class="sub">base64 &middot; JSON &middot; JWT — everything runs locally</p>
  </header>

  <div class="controls">
    <fieldset class="modes" id="modes">
      <label><input type="radio" name="mode" value="auto" checked><span>Auto</span></label>
      <label><input type="radio" name="mode" value="b64-encode"><span>Encode</span></label>
      <label><input type="radio" name="mode" value="b64-decode"><span>Decode</span></label>
      <label><input type="radio" name="mode" value="json-pretty"><span>Pretty</span></label>
      <label><input type="radio" name="mode" value="json-min"><span>Minify</span></label>
      <label><input type="radio" name="mode" value="validate"><span>Validate</span></label>
      <label><input type="radio" name="mode" value="jwt"><span>JWT</span></label>
      <label><input type="radio" name="mode" value="ansible"><span>Ansible</span></label>
    </fieldset>

    <label class="toggle" id="urlsafe-label" title="use - and _ instead of + and / (JWTs, URLs)">
      <input type="checkbox" id="urlsafe"><span>URL-safe</span>
    </label>
  </div>

  <div class="toolbar">
    <button id="go" class="primary" title="Ctrl+Enter">Transform</button>
    <button id="swap" class="ghost" title="move output back to input">&#8646; Swap</button>
    <button id="copy" class="ghost" title="Alt+C">Copy output</button>
    <span id="kind"></span>
  </div>

  <div id="error" title="click to jump to the error"></div>

  <div class="panes">
    <section class="pane">
      <div class="pane-head">Input</div>
      <textarea id="input" placeholder='paste JSON, base64, a JWT — or any text in an explicit mode' autofocus spellcheck="false"></textarea>
    </section>
    <section class="pane">
      <div class="pane-head">Output</div>
      <textarea id="output" readonly placeholder="result appears here" spellcheck="false"></textarea>
      <div id="logview" class="logview" hidden></div>
    </section>
  </div>

  <p class="hints">Ctrl+Enter run &middot; Alt+C copy &middot; Esc clear &middot; paste runs instantly</p>
</main>

<script src="/app.js"></script>
</body>
</html>
