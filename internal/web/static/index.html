<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codec</title>
<style>
  :root {
    --bg: #10141a; --panel: #1a2029; --border: #2c3542;
    --text: #d7dde6; --muted: #7d8896; --accent: #4da3ff; --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 2rem 1rem;
  }
  main { width: 100%; max-width: 900px; }
  h1 { font-size: 1.3rem; margin: 0 0 0.25rem; }
  h1 span { color: var(--accent); }
  p.sub { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.9rem; }
  textarea {
    width: 100%; min-height: 160px; resize: vertical;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 0.75rem; font: 0.9rem/1.45 ui-monospace, monospace;
  }
  textarea:focus { outline: 1px solid var(--accent); }
  .row { display: flex; align-items: center; gap: 0.75rem; margin: 0.75rem 0; }
  button {
    background: var(--accent); color: #0b0e13; border: 0;
    padding: 0.5rem 1.1rem; border-radius: 6px;
    font-weight: 600; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--accent);
    border: 1px solid var(--border); }
  #kind {
    font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 99px;
    border: 1px solid var(--border); color: var(--muted); display: none;
  }
  #error { color: var(--err); font-size: 0.85rem; margin: 0.5rem 0; display: none; }
  .flash { animation: flash 0.4s; }
  @keyframes flash { from { outline: 2px solid var(--accent); } }
</style>
</head>
<body>
<main>
  <h1><span>codec</span> — paste anything</h1>
  <p class="sub">JSON is encoded to base64 · base64 is decoded (JSON inside is pretty-printed) · JWTs are expanded</p>

  <textarea id="input" placeholder='{"paste":"json, base64 or a JWT here"}' autofocus></textarea>

  <div class="row">
    <button id="go">Transform</button>
    <span id="kind"></span>
    <span style="flex:1"></span>
    <button id="copy" class="ghost">Copy output</button>
  </div>

  <div id="error"></div>

  <textarea id="output" readonly placeholder="result appears here"></textarea>
</main>

<script>
const input  = document.getElementById("input");
const output = document.getElementById("output");
const kind   = document.getElementById("kind");
const errBox = document.getElementById("error");

async function transform() {
  errBox.style.display = "none";
  kind.style.display = "none";

  const res = await fetch("/api/transform", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ input: input.value }),
  });
  const data = await res.json();

  if (!res.ok) {
    output.value = "";
    errBox.textContent = data.line
      ? `${data.error} (line ${data.line}, column ${data.column})`
      : data.error;
    errBox.style.display = "block";
    return;
  }

  output.value = data.output;
  kind.textContent = "detected: " + data.kind;
  kind.style.display = "inline-block";
  output.classList.remove("flash");
  void output.offsetWidth; // restart the animation
  output.classList.add("flash");
}

document.getElementById("go").addEventListener("click", transform);

// Transform immediately on paste — the "it just works" moment.
input.addEventListener("paste", () => setTimeout(transform, 0));

// Ctrl+Enter transforms too, for hand-typed input.
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) transform();
});

document.getElementById("copy").addEventListener("click", async () => {
  await navigator.clipboard.writeText(output.value);
  const btn = document.getElementById("copy");
  btn.textContent = "Copied!";
  setTimeout(() => (btn.textContent = "Copy output"), 1200);
});
</script>
</body>
</html>
