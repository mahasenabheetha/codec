apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
data:
  shop.properties: |
    name=shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  labels:
    app: shop
spec:
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      serviceAccountName: shop
      containers:
        - name: shop
          image: registry.example.com/shop:1.4.0
          envFrom:
            - configMapRef:
                name: shop-config
            - secretRef:
                name: shop-secrets
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: shop
spec:
  selector:
    app: shop
  ports:
    - port: 80
