# Editor snippets. Bodies use CodeMirror's placeholder syntax: ${1:text}
# is the first field (Tab moves on), ${0} is where the cursor ends.
# Lines after the first are indented like the line the snippet starts
# on. A body starting with "- " is a list item.
- label: container
  types: [kubernetes, helm-template, argo-workflows]
  detail: Container with a port, probes and resources
  body: |
    - name: ${1:app}
      image: ${2:registry.example.com/app:1.0.0}
      ports:
        - name: http
          containerPort: ${3:8080}
      readinessProbe:
        httpGet:
          path: /
          port: http
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi${0}

- label: probe
  types: [kubernetes, helm-template]
  detail: Readiness and liveness probes
  body: |
    readinessProbe:
      httpGet:
        path: ${1:/healthz}
        port: ${2:http}
      periodSeconds: 10
    livenessProbe:
      httpGet:
        path: ${1:/healthz}
        port: ${2:http}
      initialDelaySeconds: 10
      periodSeconds: 20${0}

- label: resources
  types: [kubernetes, helm-template, argo-workflows]
  detail: CPU and memory requests and a memory limit
  body: |
    resources:
      requests:
        cpu: ${1:100m}
        memory: ${2:128Mi}
      limits:
        memory: ${3:256Mi}${0}

- label: step
  types: [github-actions]
  detail: A step that runs a command
  body: |
    - name: ${1:Test}
      run: ${2:make test}${0}

- label: uses
  types: [github-actions]
  detail: A step that uses an action
  body: |
    - uses: ${1:actions/setup-go@v6}
      with:
        ${2:go-version-file}: ${3:go.mod}${0}

- label: job
  types: [github-actions]
  detail: A job with checkout and one step
  body: |
    ${1:build}:
      runs-on: ${2:ubuntu-latest}
      timeout-minutes: 15
      steps:
        - uses: actions/checkout@v5
        - name: ${3:Build}
          run: ${4:make}${0}

- label: job
  types: [gitlab-ci]
  detail: A job with a stage, needs, rules and a script
  body: |
    ${1:job-name}:
      stage: ${2:test}
      image: ${3:alpine:3.22}
      needs: []
      rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      script:
        - ${4:echo "hello"}${0}

- label: task
  types: [ansible-playbook]
  detail: A task with a module and a name
  body: |
    - name: ${1:Install nginx}
      ansible.builtin.${2:package}:
        name: ${3:nginx}
        state: ${4:present}${0}

- label: service
  types: [compose]
  detail: A service with a port, restart policy and health check
  body: |
    ${1:web}:
      image: ${2:nginx:1.27}
      restart: unless-stopped
      ports:
        - "127.0.0.1:${3:8080}:${4:80}"
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://localhost:${4:80}/ > /dev/null || exit 1"]
        interval: 10s${0}
