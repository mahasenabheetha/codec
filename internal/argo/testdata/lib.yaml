apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: shared-steps
spec:
  templates:
    - name: notify
      inputs:
        parameters:
          - name: message
          - name: channel
            value: "#builds-{{workflow.parameters.env}}"
      script:
        image: curlimages/curl:8.10.1
        command: [sh]
        source: |
          curl -d '{{inputs.parameters.message}}' https://chat.example.com/{{inputs.parameters.channel}}
    - name: publish
      inputs:
        parameters:
          - name: artifact
          - name: registry
            default: registry.example.com
      steps:
        - - name: push
            template: push-image
            arguments:
              parameters:
                - name: ref
                  value: "{{inputs.parameters.artifact}}"
        - - name: sign
            template: push-image
            arguments:
              parameters:
                - name: ref
                  value: "{{inputs.parameters.artifact}}.sig"
          - name: announce
            template: say
            arguments:
              parameters:
                - name: text
                  value: "published {{inputs.parameters.artifact}}"
    - name: push-image
      inputs:
        parameters:
          - name: ref
      container:
        image: gcr.io/go-containerregistry/crane:v0.20.2
        args: [push, /work/image.tar, "{{inputs.parameters.ref}}"]
    - name: say
      inputs:
        parameters:
          - name: text
      container:
        image: busybox:1.36
        args: [echo, "{{inputs.parameters.text}}"]
---
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: cluster-tools
spec:
  templates:
    - name: scan
      container:
        image: aquasec/trivy:0.56.1
        args: [image, --exit-code, "1", registry.example.com/app]
