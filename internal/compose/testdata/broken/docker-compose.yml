services:
  api:
    image: api
    depends_on: [dbb]
    networks: [backend]
    ports: ["8080:80"]
    volumes: [data:/data]
  db:
    image: postgres
    depends_on: [cache]
  cache:
    image: redis:${REDIS_TAG}
    depends_on: [db]
  proxy:
    image: nginx
    ports: ["8080:8080"]
    environment:
      TOKEN: ${TOKEN:?set a token}
networks:
  back: {}
