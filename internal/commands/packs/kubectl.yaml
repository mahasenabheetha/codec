# kubectl: a seed for the engine's tests (3.10.0 T1); T5 adds the rest.
name: kubectl
aliases: [k]
group: kubernetes
summary: kubectl, the Kubernetes command-line client.
flags:
  - names: [-n, --namespace]
    value: namespace
    persistent: true
    summary: works in this namespace
  - names: [-A, --all-namespaces]
    persistent: true
    summary: works across every namespace
  - names: [--context]
    value: context
    persistent: true
    summary: uses this context from your kubeconfig
commands:
  - name: get
    summary: Lists resources, or shows one.
    flags:
      - names: [-o, --output]
        value: format
        common: true
        summary: prints in this format
        choices:
          - {value: wide, summary: more columns}
          - {value: yaml, summary: the full resource as YAML}
          - {value: json, summary: the full resource as JSON}
          - {value: name, summary: only kind/name}
      - names: [-l, --selector]
        value: selector
        common: true
        summary: only resources whose labels match, such as app=web
      - names: [-w, --watch]
        summary: keeps watching and prints changes as they happen
    args:
      - name: resource
        summary: the kind of resource, such as pods or deploy
        choices:
          - {value: pods, summary: the pods}
          - {value: po, summary: the pods}
          - {value: deployments, summary: the deployments}
          - {value: deploy, summary: the deployments}
      - name: name
        optional: true
        repeat: true
        summary: only these by name
  - name: logs
    summary: Prints a container's logs.
    flags:
      - names: [-f, --follow]
        common: true
        summary: keeps printing new lines as they come
      - names: [-c, --container]
        value: container
        summary: the container, when the pod has several
      - names: [--tail]
        value: lines
        common: true
        summary: only the last this many lines
      - names: [-p, --previous]
        common: true
        summary: the logs of the container before it restarted
    args:
      - name: pod
        summary: the pod, or type/name such as deploy/web
  - name: rollout
    summary: Manages a rollout of a deployment, daemon set or stateful set.
    commands:
      - name: restart
        summary: Restarts the pods one by one, by changing the template's annotation.
        args:
          - name: resource
            summary: the workload, such as deployment/web
      - name: undo
        summary: Goes back to the previous revision.
        danger:
          level: caution
          note: changes what runs in the cluster
        args:
          - name: resource
            summary: the workload, such as deployment/web
  - name: delete
    summary: Deletes resources.
    danger:
      level: danger
      note: the resources are gone; anything not kept elsewhere can't be brought back
      safer: kubectl delete --dry-run=client -o name …
    flags:
      - names: [--dry-run]
        value: strategy
        optionalValue: true
        summary: shows what would be deleted without deleting it
        choices: [none, client, server]
      - names: [--all]
        summary: every resource of the kind in the namespace
        danger:
          level: danger
          note: deletes all of them
    args:
      - name: resource
        summary: the kind of resource, or type/name
      - name: name
        optional: true
        repeat: true
        summary: which ones by name
recipes:
  - title: List the pods in a namespace
    command: kubectl get pods -n {namespace}
    words: [show pods, what is running]
  - title: List the pods with their node and IP
    command: kubectl get pods -o wide -n {namespace}
    words: [where pods run, node, ip address]
  - title: Find the pods of an app by label
    command: kubectl get pods -l app={app} -n {namespace}
    words: [selector, filter pods]
  - title: Watch pods change as they happen
    command: kubectl get pods -w -n {namespace}
    words: [live, monitor, wait]
  - title: Follow a pod's logs
    command: kubectl logs -f --tail=100 {pod} -n {namespace}
    words: [stream logs, tail logs, live output]
  - title: Read the logs of the crashed container
    command: kubectl logs -p {pod} -n {namespace}
    words: [crashloop, previous logs, restarted, why did it crash]
  - title: Restart a deployment's pods
    command: kubectl rollout restart deployment/{name} -n {namespace}
    words: [bounce, recreate pods, reload config]
  - title: Roll back a deployment to the previous version
    command: kubectl rollout undo deployment/{name} -n {namespace}
    words: [revert deploy, bad release, go back]
  - title: See what a delete would remove, without deleting
    command: kubectl delete --dry-run=client {resource} -n {namespace}
    words: [preview delete, safe delete, what would happen]
