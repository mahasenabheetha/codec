name: CodeQL

# GitHub's code scanning: the Go server and CLI, the Svelte/TypeScript
# frontend and these workflows, checked for security problems on every
# change and weekly (new queries find old code). Results are under
# Security → Code scanning. Free for public repositories.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go is compiled so CodeQL sees the real types; the embedded
          # frontend isn't needed for that (internal/web/dist keeps a
          # placeholder).
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # The default queries and the extended security ones.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
