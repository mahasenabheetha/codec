name: Release

# Runs only when a version tag is pushed, e.g. `git push origin v1.0.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release and upload assets
  packages: write # push the Docker image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser needs full history for the changelog

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # GoReleaser's before-hooks build the frontend with npm.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Never publish a release that fails the same gates as CI.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The image is multi-platform (amd64 + arm64). The Dockerfile only
      # copies prebuilt binaries, so buildx is enough; no QEMU needed.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Windows desktop app: portable exe and per-user installer, added
  # to the release GoReleaser created above as a draft (scripts/desktop.sh),
  # then publishes it.
  desktop:
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: NSIS
        run: |
          if ! command -v makensis >/dev/null && [[ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]]; then
            choco install nsis -y --no-progress
          fi

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          export MAKENSIS="$(command -v makensis || echo "/c/Program Files (x86)/NSIS/makensis.exe")"
          scripts/desktop.sh

      # Code signing (SignPath, see design/roadmap.md "Code signing") goes
      # here once the project is approved; until then the files are
      # unsigned and Windows shows "unknown publisher" on first run.

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          cd dist/desktop
          mv codec-desktop.exe "codec-desktop_${v}_windows_amd64.exe"
          mv codec-setup.exe "codec-desktop_${v}_windows_amd64_setup.exe"
          sha256sum codec-desktop_* > "codec-desktop_${v}_checksums.txt"
          gh release upload "$TAG" codec-desktop_* --clobber

      # GoReleaser leaves the release as a draft; publish it only now,
      # with every file attached.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
