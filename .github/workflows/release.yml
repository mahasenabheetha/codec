name: Release

# Runs only when a version tag is pushed, e.g. `git push origin v1.0.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release and upload assets
  packages: write # push the Docker image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser needs full history for the changelog

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # GoReleaser's before-hooks build the frontend with npm.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Never publish a release that fails the same gates as CI.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The image is multi-platform (amd64 + arm64). The Dockerfile only
      # copies prebuilt binaries, so buildx is enough; no QEMU needed.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
