name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI checks code, it never writes to the repository.
permissions:
  contents: read

jobs:
  test:
    # Windows is a first-class platform (the main dev machine), so it
    # gets a real build-and-test run, not just a cross-compile.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest Go patch release, so builds carry its security
          # fixes; go.mod's go line is only the minimum.
          go-version: stable
          check-latest: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The frontend must be built first: the Go binary embeds it.
      - name: Frontend install
        run: npm --prefix frontend ci

      - name: Frontend type-check
        run: npm --prefix frontend run check

      # Node's own test runner on the pure TypeScript modules; no deps.
      - name: Frontend tests
        run: npm --prefix frontend test

      - name: Frontend build
        run: npm --prefix frontend run build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Linux only: the race detector needs cgo, and one run of the
      # checks below is enough. Tools are pinned; bump them by hand.
      - name: Test with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      - name: Staticcheck
        if: matrix.os == 'ubuntu-latest'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Known vulnerabilities
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build
        run: go build ./...

      - name: Validate release config
        if: matrix.os == 'ubuntu-latest'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
