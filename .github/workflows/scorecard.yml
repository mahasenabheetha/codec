name: Scorecard

# OpenSSF Scorecard: rates the project's security practices (branch
# protection, pinned dependencies, signed releases, workflow permissions,
# code review and more), publishes the score for the README badge and
# lists what to improve under Security → Code scanning. Free; see
# https://scorecard.dev.
#
# With publish_results the action checks this file: no top-level env or
# defaults, and only well-known actions in the job.

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the results to code scanning
      id-token: write # publish the score (for the badge)
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
