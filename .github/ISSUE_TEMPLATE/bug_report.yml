name: Bug report
description: Something codec does wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest YAML (or steps on the sample repository, `codec serve --sample`) that shows it. Remove anything secret.
      render: yaml
  - type: input
    id: version
    attributes:
      label: codec version
      description: Output of `codec version`.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Web UI, CLI, Docker image, Other]
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15 (arm64), Ubuntu 24.04…
